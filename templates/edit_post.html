{% extends "base.html" %}

{% block title %}MiniSocial - Edit Post{% endblock %}

{% block content %}
<section class="card">
  <h2>Edit post</h2>
  <form action="{{ url_for('edit_post', post_id=post['id']) }}" method="POST">
    <label for="content">Post text</label>
    <textarea id="content" name="content" rows="4" required>{{ post["content"] }}</textarea>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a class="btn btn-link" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
